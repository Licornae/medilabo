<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détail patient</title>
</head>
<body>

<h1>Détail du patient</h1>

<p>
    <strong>Prénom :</strong>
    <span th:text="${patient.firstName}"></span>
</p>

<p>
    <strong>Nom :</strong>
    <span th:text="${patient.lastName}"></span>
</p>

<p>
    <strong>Date de naissance :</strong>
    <span th:text="${patient.birthDate}"></span>
</p>

<p>
    <strong>Genre :</strong>
    <span th:text="${patient.gender}"></span>
</p>

<p>
    <strong>Adresse :</strong>
    <span th:text="${patient.address}"></span>
</p>

<p>
    <strong>Téléphone :</strong>
    <span th:text="${patient.phoneNumber}"></span>
</p>

<a th:href="@{/patients/{id}/edit(id=${patient.id})}">
    Modifier
</a>

<a th:href="@{/patients}">Retour à la liste</a>

</body>
</html>
