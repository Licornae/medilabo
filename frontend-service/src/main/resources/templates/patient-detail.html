<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Détail patient</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
<h1>Détail du patient</h1>

<p>
    <strong>Prénom :</strong>
    <span th:text="${patient.firstName}"></span>
</p>

<p>
    <strong>Nom :</strong>
    <span th:text="${patient.lastName}"></span>
</p>

<p>
    <strong>Date de naissance :</strong>
    <span th:text="${patient.birthDate}"></span>
</p>

<p>
    <strong>Genre :</strong>
    <span th:text="${patient.gender}"></span>
</p>

<p>
    <strong>Adresse :</strong>
    <span th:text="${patient.address}"></span>
</p>

<p>
    <strong>Téléphone :</strong>
    <span th:text="${patient.phoneNumber}"></span>
</p>

<a class="button" th:href="@{/patients/{id}/edit(id=${patient.id})}">
    Modifier
</a>

<a class="button" th:href="@{/patients}">Retour à la liste</a>
</main>
</body>
</html>
