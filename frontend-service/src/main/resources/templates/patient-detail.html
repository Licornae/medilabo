<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Détail patient</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
<h1>Détail du patient</h1>

<p>
    <strong>Prénom :</strong>
    <span th:text="${patient.firstName}"></span>
</p>

<p>
    <strong>Nom :</strong>
    <span th:text="${patient.lastName}"></span>
</p>

<p>
    <strong>Date de naissance :</strong>
    <span th:text="${patient.birthDate}"></span>
</p>

<p>
    <strong>Genre :</strong>
    <span th:text="${patient.gender}"></span>
</p>

<p>
    <strong>Adresse :</strong>
    <span th:text="${patient.address}"></span>
</p>

<p>
    <strong>Téléphone :</strong>
    <span th:text="${patient.phoneNumber}"></span>
</p>

<h2>Notes médicales</h2>
<div th:if="${#lists.isEmpty(notes)}">
    <p>Aucune note médicale.</p>
</div>
<div th:if="${!#lists.isEmpty(notes)}">
    <div th:each="note : ${notes}">
        <p th:text="${note.note}"></p>
    </div>
</div>

<h2>Ajouter une note</h2>
<form th:action="@{/patients/{id}/notes(id=${patient.id})}"
      method="post">
    <input type="hidden"
           name="patient"
           th:value="${patient.lastName}">
    <div>
        <label for="note">Note médicale</label>
        <textarea id="note"
                  name="note"
                  rows="5"
                  required></textarea>
    </div>
    <div class="form-actions">
        <button type="submit">Ajouter la note</button>
    </div>
</form>

<a class="button" th:href="@{/patients/{id}/edit(id=${patient.id})}">
    Modifier
</a>

<a class="button" th:href="@{/patients}">Retour à la liste</a>
</main>
</body>
</html>
